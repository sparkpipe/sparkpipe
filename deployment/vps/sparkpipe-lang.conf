RewriteMap sparkpipe_kr "dbm=sdbm:/etc/apache2/sparkpipe/kr24"

RewriteCond %{QUERY_STRING} (?:^|&)lang=(ko|en)(?:&|$)
RewriteRule ^/([^/]*)$ /$1? [CO=lang:%1:sparkpipe.ai:525600:/:true:true:Lax,R=302,L]

RewriteCond %{HTTP_REFERER} !^https://sparkpipe\.ai/
RewriteCond %{HTTP_COOKIE} (?:^|;\s*)lang=ko(?:;|$)
RewriteRule ^ - [E=SPARKPIPE_KO:1]

RewriteCond %{HTTP_REFERER} !^https://sparkpipe\.ai/
RewriteCond %{HTTP_COOKIE} !(?:^|;\s*)lang=(?:ko|en)(?:;|$)
RewriteCond %{REMOTE_ADDR} ^(\d+\.\d+\.\d+)\.\d+$
RewriteCond ${sparkpipe_kr:%1|-} =kr
RewriteRule ^ - [E=SPARKPIPE_KO:1]

RewriteCond %{ENV:SPARKPIPE_KO} =1
RewriteRule ^/(?:index\.html)?$ /index-ko.html [R=302,L]

RewriteCond %{ENV:SPARKPIPE_KO} =1
RewriteRule ^/(fleets|terms|privacy|hourly-terms|agreement)\.html$ /$1-ko.html [R=302,L]

<FilesMatch "\.html$">
	Header merge Vary "Cookie"
</FilesMatch>
