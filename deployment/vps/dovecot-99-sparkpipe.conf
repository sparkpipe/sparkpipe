protocols = imap lmtp
listen = *

mail_home = /var/vmail/%d/%n
mail_location = maildir:~/Maildir
mail_uid = vmail
mail_gid = vmail
mail_privileged_group =
first_valid_uid = 5000
last_valid_uid = 5000
mail_plugins = quota

ssl = required
ssl_min_protocol = TLSv1.2
ssl_cert = </etc/letsencrypt/live/sparkpipe.ai/fullchain.pem
ssl_key = </etc/letsencrypt/live/sparkpipe.ai/privkey.pem

service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

protocol imap {
  mail_plugins = $mail_plugins imap_quota
  mail_max_userip_connections = 20
}

protocol lmtp {
  mail_plugins = $mail_plugins
  postmaster_address = postmaster@sparkpipe.ai
}

plugin {
  quota = maildir:User quota
  quota_rule = *:storage=5G
}
