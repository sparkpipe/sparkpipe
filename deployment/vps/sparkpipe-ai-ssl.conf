<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerName sparkpipe.ai
	ServerAlias www.sparkpipe.ai
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html

	RewriteEngine On
	RewriteCond %{HTTP_HOST} !^sparkpipe\.ai$ [NC]
	RewriteRule ^ https://sparkpipe.ai%{REQUEST_URI} [END,NE,R=permanent]

	Include /etc/apache2/sparkpipe/lang.conf
	Include /etc/apache2/sparkpipe/public-api.conf
	Include /etc/apache2/sparkpipe/sparkpipe-pay.conf

	RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
	Header always set X-Content-Type-Options "nosniff"
	Header always set Referrer-Policy "same-origin"
	Header always set X-Frame-Options "DENY"
	Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
	Header always set Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
	<FilesMatch "\.(html|)$">
		Header set Cache-Control "no-cache"
	</FilesMatch>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	Include /etc/letsencrypt/options-ssl-apache.conf
	SSLCertificateFile /etc/letsencrypt/live/sparkpipe.ai/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/sparkpipe.ai/privkey.pem
</VirtualHost>
</IfModule>
