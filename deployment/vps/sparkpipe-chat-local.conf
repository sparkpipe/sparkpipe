RedirectMatch ^/local$ /local/
Alias /local/ /var/www/chat-local/
<Directory /var/www/chat-local>
	Options -Indexes
	Require all granted
</Directory>
ProxyPassMatch ^/local$ !
ProxyPass /local/ !
<LocationMatch "^/local(/|$)">
	Header always set X-Content-Type-Options "nosniff"
	Header always set Referrer-Policy "no-referrer"
	Header always set X-Frame-Options "DENY"
	Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
	Header always set Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; font-src https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
</LocationMatch>
