enabled = true;
sign_authenticated = true;
sign_local = true;
sign_inbound = false;
use_domain = "header";
use_esld = false;
try_fallback = false;
check_pubkey = true;
allow_pubkey_mismatch = false;
allow_hdrfrom_mismatch = false;
allow_hdrfrom_multiple = false;
allow_username_mismatch = false;

domain {
  sparkpipe.ai {
    selector = "s202608";
    path = "/var/lib/rspamd/dkim/sparkpipe.ai.s202608.key";
  }
  hyor.io {
    selector = "s202610";
    path = "/var/lib/rspamd/dkim/hyor.io.s202610.key";
  }
}
