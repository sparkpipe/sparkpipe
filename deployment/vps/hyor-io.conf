<VirtualHost *:80>
	ServerName hyor.io
	ServerAlias www.hyor.io
	DocumentRoot /var/www/hyor
	<IfFile /etc/letsencrypt/live/hyor.io/fullchain.pem>
		RewriteEngine On
		RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
		RewriteRule ^ https://hyor.io%{REQUEST_URI} [END,NE,R=permanent]
	</IfFile>
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<IfFile /etc/letsencrypt/live/hyor.io/fullchain.pem>
<VirtualHost *:443>
	ServerName hyor.io
	ServerAlias www.hyor.io
	DocumentRoot /var/www/hyor
	RewriteEngine On
	RewriteCond %{HTTP_HOST} !^hyor\.io$ [NC]
	RewriteRule ^ https://hyor.io%{REQUEST_URI} [END,NE,R=permanent]

	RewriteMap hyor_kr "dbm=sdbm:/etc/apache2/sparkpipe/kr24"
	RewriteCond %{QUERY_STRING} (?:^|&)lang=(ko|en)(?:&|$)
	RewriteRule ^/([^/]*)$ /$1? [CO=lang:%1:hyor.io:525600:/:true:true:Lax,R=302,L]
	RewriteCond %{HTTP_REFERER} !^https://hyor\.io/
	RewriteCond %{HTTP_COOKIE} (?:^|;\s*)lang=ko(?:;|$)
	RewriteRule ^ - [E=HYOR_KO:1]
	RewriteCond %{HTTP_REFERER} !^https://hyor\.io/
	RewriteCond %{HTTP_COOKIE} !(?:^|;\s*)lang=(?:ko|en)(?:;|$)
	RewriteCond %{REMOTE_ADDR} ^(\d+\.\d+\.\d+)\.\d+$
	RewriteCond ${hyor_kr:%1|-} =kr
	RewriteRule ^ - [E=HYOR_KO:1]
	RewriteCond %{ENV:HYOR_KO} =1
	RewriteRule ^/(?:index\.html)?$ /index-ko.html [R=302,L]

	RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
	Header always set X-Content-Type-Options "nosniff"
	Header always set Referrer-Policy "same-origin"
	Header always set X-Frame-Options "DENY"
	Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
	Header always set Content-Security-Policy "default-src 'self'; connect-src 'none'; img-src 'self'; font-src https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com; script-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; upgrade-insecure-requests"
	<FilesMatch "\.(html|)$">
		Header set Cache-Control "no-cache"
		Header merge Vary "Cookie"
	</FilesMatch>
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
	Include /etc/letsencrypt/options-ssl-apache.conf
	SSLCertificateFile /etc/letsencrypt/live/hyor.io/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/hyor.io/privkey.pem
</VirtualHost>
</IfFile>
</IfModule>
