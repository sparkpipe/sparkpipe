<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f1ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>SparkPipe Chat · Local mode</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,100..800&family=Noto+Sans+KR:wght@100..900&display=swap">
<link rel="stylesheet" href="chat.css">
<style>
html:lang(ko) { --display: 'Archivo', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; --text: 'Archivo', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; --mono: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
html:lang(ko) body { word-break: keep-all; overflow-wrap: break-word; }
.lang { display: inline-flex; flex: none; border: 1px solid var(--rule-strong); border-radius: 2px; overflow: hidden; margin-left: 12px; }
.lang button { min-height: 30px; padding: 0 10px; border: 0; background: transparent; color: var(--steel); font: 600 12px/1 var(--text); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.local-note { border: 1px solid var(--rule-strong); border-left: 3px solid var(--signal); padding: 10px 12px; font: 400 13px/1.55 var(--text); color: var(--ink); background: var(--paper); }
.local-note b { font-weight: 650; }
.signin { max-width: 720px; margin: 8vh auto 0; display: grid; gap: 14px; }
</style>
</head>
<body class="app">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><mask id="logo-bore" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 3.5 11 16.5H21L10.5 28.5" stroke="#fff" stroke-width="5.6"/><path d="M21.5 3.5 11 16.5H21L10.5 28.5" stroke="#000" stroke-width="1.5"/></g></mask></defs><symbol id="logo" viewBox="0 0 32 32"><rect width="32" height="32" fill="currentColor" mask="url(#logo-bore)"/></symbol></svg>

<header class="nav">
  <div class="wrap wide">
    <a class="brand" href="/"><svg width="26" height="26"><use href="#logo"/></svg>SparkPipe<span class="tag" data-t="tag"></span></a>
    <nav class="nav-links" aria-label="Site">
      <a href="/" data-t="back"></a>
      <a id="privacy" href="https://sparkpipe.ai/privacy.html" data-t="privacy"></a>
    </nav>
    <span class="status" aria-live="polite"><i id="dot" class="dot"></i><span id="status"></span></span>
    <div class="lang" role="group" aria-label="Language / 언어"><button type="button" data-lang="en-US">EN</button><button type="button" data-lang="ko-KR">한국어</button></div>
  </div>
</header>

<main class="console">
  <aside class="side form">
    <p class="local-note" data-t="localNote" data-html="1"></p>
    <div class="row"><button id="new" class="btn small solid" type="button" data-t="newChat"></button><button id="rename" class="link" type="button" data-t="rename"></button><button id="export" class="link" type="button" data-t="export"></button><button id="delete" class="link" type="button" data-t="delete"></button></div>
    <nav id="chats" class="chats" aria-label="Chats in this browser"></nav>
    <label for="model"><span data-t="model"></span><select id="model"></select></label>
    <p id="models-note" class="hint"></p>
    <details class="snippet" open>
      <summary data-t="context"></summary>
      <label for="memory"><span data-t="memory"></span><select id="memory"><option value="full" data-t="memoryFull"></option><option value="compact" data-t="memoryCompact"></option></select></label>
      <label for="target"><span data-t="target"></span><input id="target" type="number" min="1024" step="1024"></label>
      <p class="hint" data-t="memoryHint"></p>
    </details>
    <details class="snippet">
      <summary data-t="timer"></summary>
      <label class="check" for="timer-on"><input id="timer-on" type="checkbox"><span data-t="timerOn"></span></label>
      <label for="timer-minutes"><span data-t="timerEvery"></span><input id="timer-minutes" type="number" min="1" step="1" value="30"></label>
      <label for="timer-prompt"><span data-t="timerPrompt"></span><textarea id="timer-prompt" rows="4"></textarea></label>
      <p id="timer-note" class="hint"></p>
    </details>
    <details class="snippet">
      <summary data-t="options"></summary>
      <div class="pair">
        <label for="max"><span data-t="replyLimit"></span><input id="max" type="number" min="1" step="1"></label>
        <label for="temp"><span data-t="temperature"></span><input id="temp" type="number" min="0" max="2" step="0.1"></label>
        <label for="seed"><span data-t="seed"></span><input id="seed" type="number" min="0" step="1"></label>
      </div>
      <label class="check" for="stream"><input id="stream" type="checkbox" checked><span data-t="stream"></span></label>
      <p class="hint" data-t="optionsHint"></p>
    </details>
    <div class="snippet">
      <p class="hint" data-t="storageHint"></p>
      <p id="storage-note" class="hint"></p>
      <div class="row"><button id="export-all" class="link" type="button" data-t="exportAll"></button><button id="import" class="link" type="button" data-t="import"></button><button id="delete-all" class="link" type="button" data-t="deleteAll"></button></div>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
    </div>
  </aside>

  <section class="chat">
    <div id="messages" class="messages" aria-live="polite">
      <div id="empty" class="empty">
        <p class="label signal" data-t="emptyLabel"></p>
        <h2 data-t="emptyTitle"></h2>
        <p data-t="emptyText"></p>
      </div>
    </div>
    <div class="composer">
      <div class="gauge">
        <div class="gauge-bar" aria-hidden="true"><i id="gauge-used"></i><b id="gauge-target"></b></div>
        <div class="gauge-row"><span id="gauge-text"></span><span id="note" aria-live="polite"></span><span id="gauge-mode"></span></div>
      </div>
      <div class="composer-row">
        <textarea id="prompt" rows="1" aria-label="Prompt"></textarea>
        <button id="send" class="btn solid" type="button"></button>
      </div>
      <div class="composer-meta"><span data-t="enterHint"></span><button id="compact" class="link" type="button" data-t="compactNow"></button></div>
    </div>
  </section>
</main>
