GRUB_DISTRIBUTOR="SparkPipe"
GRUB_TIMEOUT=5
GRUB_TIMEOUT_STYLE=menu
GRUB_RECORDFAIL_TIMEOUT=5
GRUB_TERMINAL="console serial"
GRUB_SERIAL_COMMAND="serial efi0 --speed=921600 --word=8 --parity=no --stop=1"
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX earlycon=uart,mmio32,0x16A00000 init_on_alloc=0 iommu.passthrough=0 pci=pcie_bus_safe initcall_blacklist=tegra234_cbb_init crashkernel=1G-:0M panic=60"
