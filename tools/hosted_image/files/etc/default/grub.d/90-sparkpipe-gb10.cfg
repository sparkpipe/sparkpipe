GRUB_DISTRIBUTOR="SparkPipe"
GRUB_TIMEOUT=5
GRUB_TIMEOUT_STYLE=menu
GRUB_RECORDFAIL_TIMEOUT=5
GRUB_TERMINAL="console serial"
GRUB_SERIAL_COMMAND="serial efi0 --speed=921600 --word=8 --parity=no --stop=1"
GRUB_CMDLINE_LINUX_DEFAULT=""
GRUB_CMDLINE_LINUX="console=tty0 console=ttyS0,921600 earlycon=uart,mmio32,0x16A00000 init_on_alloc=0 iommu.passthrough=1 pci=pcie_bus_safe initcall_blacklist=tegra234_cbb_init,power_wrap_init kho=off crashkernel=1G-:0M fsck.mode=skip fsck.repair=no"
