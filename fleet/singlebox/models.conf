# single-box multi-model serving: one deployment per model, one box.
#
# Each block names ONE residentd deployment. The supervisor
# (multi_model_serving.sh) renders config/model_resident.json for every
# model from its block, so nothing here is decorative: every field lands
# in the schema-2 deployment JSON or in the daemon environment.
#
# ISOLATION CONTRACT (mirrors COORDINATION.md, scoped to one box):
# - Every model owns a DISJOINT port set: control_endpoint port and a
#   transport base of 8 consecutive ports. Preflight refuses overlaps.
# - Every model owns its own runtime root and KV backing directory.
# - tier=always-on models coexist; at most ONE tier=big model runs at a
#   time (starting a big one stops the running big one first; always-on
#   models are untouched). Two bands are only a naming convention here -
#   a single box cannot hold two big models either way.

# ---------------------------------------------------------------- qwen38
MODEL_NAME=qwen38-tp4
TIER=always-on
BAND=qwen
RUNTIME_ROOT=/data/singlebox/qwen38-tp4
ADAPTER_SO=build/libqwen38_serving_adapter.dylib
DRIVER_SO=build/test_modules/libqwen38_serving_driver_module.dylib
TRANSPORT_SO=build/test_modules/libmodel_resident_transport_module.dylib
ADAPTER_CONFIG=fleet/singlebox/config/qwen38-adapter.json
STAGE_PACK=
CONTROL_PORT=18180
TRANSPORT_BASE=18200
KV_BACKING_DIR=/data/singlebox/qwen38-tp4/kv
KV_BACKING_MAX_BYTES=17179869184
MAX_INFLIGHT_SUBMISSIONS=8
MAX_ACTIVE_SEQUENCES=64
MAX_INPUT_ROWS=64
RESIDENT_SEQUENCE_CAPACITY=64
KV_LOGICAL_PAGE_CAPACITY=0
KV_PHYSICAL_PAGE_CAPACITY=0
EXTRA_ENV="SPARK_QWEN38_STAGE_KV_BLOCKS=4096 SPARK_QWEN36_SERVING_SPECULATE=1"

# ------------------------------------------------------------ dsv4 flash
MODEL_NAME=dsv4-flash-tp4
TIER=always-on
BAND=dsv4-flash
RUNTIME_ROOT=/data/singlebox/dsv4-flash-tp4
ADAPTER_SO=build/libdsv4_serving_adapter.dylib
DRIVER_SO=build/test_modules/libdsv4_serving_driver_module.dylib
TRANSPORT_SO=build/test_modules/libmodel_resident_transport_module.dylib
ADAPTER_CONFIG=fleet/singlebox/config/dsv4-adapter.json
STAGE_PACK=
CONTROL_PORT=18181
TRANSPORT_BASE=18210
KV_BACKING_DIR=/data/singlebox/dsv4-flash-tp4/kv
KV_BACKING_MAX_BYTES=34359738368
MAX_INFLIGHT_SUBMISSIONS=8
MAX_ACTIVE_SEQUENCES=32
MAX_INPUT_ROWS=64
RESIDENT_SEQUENCE_CAPACITY=32
KV_LOGICAL_PAGE_CAPACITY=0
KV_PHYSICAL_PAGE_CAPACITY=0
EXTRA_ENV=""
