name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-sm121a:
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:13.3.1-devel-ubuntu24.04@sha256:4ff859525f99de5782aa73607ce24219b07dddd48d12b97c1c301d7e1cfb0a87
    steps:
      - name: Install host build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential git python3 libibverbs-dev
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify generated model contracts
        run: |
          python3 tools/generate_k3_contract.py --check
          python3 tests/test_must_work_targets.py
      - name: Compile exact Blackwell target
        env:
          NVCC: /usr/local/cuda/bin/nvcc
          CUDA_ARCH: sm_121a
        run: tools/cuda13_sm121a_compile_gate.sh
      - name: Upload compile receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cuda13-sm121a-receipts
          path: build/cuda13_sm121a_gate
          if-no-files-found: warn

  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential git python3 python3-numpy python3-pip libibverbs-dev
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the chat layer's and chat tools' Python packages from the hash lock
        run: |
          python3 -m pip install --user --break-system-packages --no-deps --require-hashes --only-binary :all: \
            -r tools/ci/host-tests-requirements.txt
      - name: Build every host target
        run: make -j"$(nproc)" all
      - name: Run the host test suite
        run: make test TEST_EXCLUDE="build/test_weightd_map"
